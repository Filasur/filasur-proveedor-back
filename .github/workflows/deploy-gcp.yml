name: Build and Deploy Cloud Run

on:
  push:
    branches:
      - main
      - test
      - dev

jobs:
  artifact:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@v4

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_JSON_TOKEN }}'

      - name: 'Set up Docker Buildx'
        uses: 'docker/setup-buildx-action@v3'

      - name: 'Login to Artifact Registry'
        uses: 'docker/login-action@v3'
        with:
          registry: 'us-docker.pkg.dev'
          username: oauth2accesstoken
          password: '${{ steps.auth.outputs.access_token }}'

      - name: 'Docker Build and Push'
        uses: 'docker/build-push-action@v5'
        with:
          context: .
          file: filasur.api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: 'us-docker.pkg.dev/${{ steps.auth.outputs.project_id }}/docker/${{ github.event.repository.name }}:${{ github.sha }}'

  deploy:
    runs-on: ubuntu-latest
    needs: artifact
    environment: ${{ github.ref_name }}

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@v4

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          token_format: 'access_token'
          credentials_json: '${{ secrets.GCP_JSON_TOKEN }}'

      - id: 'deploy'
        name: 'Deploy Cloud Run'
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          image: 'us-docker.pkg.dev/${{ steps.auth.outputs.project_id }}/docker/${{ github.event.repository.name }}:${{ github.sha }}'
          service: '${{ github.event.repository.name }}-${{ github.ref_name }}'
          region: '${{ vars.GCP_REGION }}'
          revision_traffic: 'LATEST=100'
          flags: >-
            --allow-unauthenticated
            --port=8080

      - name: 'Cloud Run URL'
        run: 'echo "${{ steps.deploy.outputs.url }}"'
